# Workflow name
name: 'Chromatic Visual Tests'

# Event for the workflow
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# List of jobs
jobs:
  chromatic-deployment:
    # Operating System
    runs-on: ubuntu-latest
    # Job steps
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 👈 Required to retrieve git history

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Run Chromatic
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # latest
        with:
          # 👇 Chromatic projectToken, refer to the manage page to obtain it.
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 👇 Compress and upload the entire storybook to chromatic, required for large projects
          zip: true
          # 👇 Auto accept changes on main branch
          autoAcceptChanges: 'main'
          # 👇 Exit with code 0 regardless of changes
          exitZeroOnChanges: true
